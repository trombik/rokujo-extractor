---
name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
        python_architecture:
          - x64
        spacy:
          - "3.8.11"
        ginza:
          - "5.2.0"
        ja_ginza:
          - "5.2.0"
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
        runs_on:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_architecture }}

      - name: Install spacy and ginza
        run: pip install --user "spacy==${{ matrix.spacy }}" "ginza==${{ matrix.ginza }}" "ja_ginza==${{ matrix.ja_ginza }}"

      - name: Install ja_core_news_sm
        run: python -m spacy download ja_core_news_sm

      - name: Set up Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
          bundler: latest
        env:
          # enable rb_sys_stable_api_compiled_fallback on head to resolve an
          # error while building: Failed to setup stable API: Stable API is
          # needed but could not find a candidate.
          RB_SYS_STABLE_API_COMPILED_FALLBACK: ${{ matrix.ruby == 'head' && true || '' }}

      - name: Run the default task
        run: bundle exec rake
